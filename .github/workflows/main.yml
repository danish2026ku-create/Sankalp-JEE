          package com.sankalp.jee.service

          import android.Manifest
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import androidx.core.app.NotificationManagerCompat
          import androidx.core.content.ContextCompat
          import androidx.work.CoroutineWorker
          import androidx.work.WorkerParameters
          import com.sankalp.jee.MainActivity
          import com.sankalp.jee.SankalpApp
          import com.sankalp.jee.data.local.SankalpDatabase
          import java.time.LocalDate

          class DailyPulseWorker(appContext: Context, workerParams: WorkerParameters) : CoroutineWorker(appContext, workerParams) {
              override suspend fun doWork(): Result {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(applicationContext, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          return Result.success()
                      }
                  }
                  val db = SankalpDatabase.getInstance(applicationContext)
                  val dueCount = try { db.sankalpDao().getDueFlashcardCount(LocalDate.now().toEpochDay()) } catch (_: Exception) { 0 }
                  val pendingIntent = PendingIntent.getActivity(
                      applicationContext, 101,
                      Intent(applicationContext, MainActivity::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val titleText = if (dueCount > 0) (dueCount.toString() + " Formula Flashcards Due") else "Protect Your JEE Focus Streak"
                  val notification = NotificationCompat.Builder(applicationContext, SankalpApp.CHANNEL_DAILY_PULSE)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle(titleText)
                      .setContentText("Open Sankalp JEE to start a deep focus block or review due flashcards.")
                      .setContentIntent(pendingIntent)
                      .setAutoCancel(true)
                      .build()
                  try { NotificationManagerCompat.from(applicationContext).notify(2026, notification) } catch (_: SecurityException) {}
                  return Result.success()
              }
          }
