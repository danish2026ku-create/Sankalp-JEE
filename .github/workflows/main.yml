          @Composable
          fun AnimatedRingMeter(
              progress: Float,
              size: Dp = 110.dp,
              strokeWidth: Dp = 10.dp,
              activeColor: Color = SankalpPalette.KesariAmber,
              trackColor: Color = MaterialTheme.colorScheme.surfaceVariant,
              centerContent: @Composable () -> Unit
          ) {
              val clamped = progress.coerceIn(0f, 1f)
              Box(modifier = Modifier.size(size), contentAlignment = Alignment.Center) {
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      val strokePx = strokeWidth.toPx()
                      val arcDiameter = this.size.minDimension - strokePx
                      val topLeft = Offset(strokePx / 2f, strokePx / 2f)
                      drawArc(color = trackColor, startAngle = -90f, sweepAngle = 360f, useCenter = false, topLeft = topLeft, size = Size(arcDiameter, arcDiameter), style = Stroke(width = strokePx, cap = StrokeCap.Round))
                      drawArc(color = activeColor, startAngle = -90f, sweepAngle = 360f * clamped, useCenter = false, topLeft = topLeft, size = Size(arcDiameter, arcDiameter), style = Stroke(width = strokePx, cap = StrokeCap.Round))
                  }
                  centerContent()
              }
          }

