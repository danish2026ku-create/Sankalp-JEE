          package com.sankalp.jee.widget

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.widget.RemoteViews
          import com.sankalp.jee.MainActivity
          import com.sankalp.jee.R

          class SankalpWidgetReceiver : AppWidgetProvider() {
              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                  for (appWidgetId in appWidgetIds) {
                      updateWidget(context, appWidgetManager, appWidgetId, null, null, null)
                  }
              }

              companion object {
                  fun pushLiveUpdate(context: Context, daysLeftText: String, focusStatsText: String, nextTaskText: String) {
                      val manager = AppWidgetManager.getInstance(context)
                      val ids = manager.getAppWidgetIds(ComponentName(context, SankalpWidgetReceiver::class.java))
                      for (id in ids) {
                          updateWidget(context, manager, id, daysLeftText, focusStatsText, nextTaskText)
                      }
                  }

                  private fun updateWidget(context: Context, appWidgetManager: AppWidgetManager, appWidgetId: Int, daysLeftText: String?, focusStatsText: String?, nextTaskText: String?) {
                      val views = RemoteViews(context.packageName, R.layout.widget_sankalp_layout)
                      if (daysLeftText != null) views.setTextViewText(R.id.widget_days_left, daysLeftText)
                      if (focusStatsText != null) views.setTextViewText(R.id.widget_focus_stats, focusStatsText)
                      if (nextTaskText != null) views.setTextViewText(R.id.widget_next_task, nextTaskText)
                      val pendingIntent = PendingIntent.getActivity(context, 0, Intent(context, MainActivity::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      views.setOnClickPendingIntent(R.id.widget_root, pendingIntent)
                      appWidgetManager.updateAppWidget(appWidgetId, views)
                  }
              }
          }
