          @OptIn(ExperimentalLayoutApi::class)
          @Composable
          fun FocusScreen(viewModel: SankalpViewModel) {
              val context = LocalContext.current
              val prefs by viewModel.userPrefs.collectAsStateWithLifecycle()
              val timerState by viewModel.timerState.collectAsStateWithLifecycle()
              var showStrictExitModal by remember { mutableStateOf(false) }
              val accessibilityActive = remember(timerState.elapsedSeconds) { ScreenTimeHelper.isAccessibilityServiceEnabled(context) }

              LazyColumn(
                  modifier = Modifier.fillMaxSize().padding(horizontal = 16.dp),
                  verticalArrangement = Arrangement.spacedBy(14.dp)
              ) {
                  item {
                      Spacer(modifier = Modifier.height(8.dp))
                      SectionHeader(title = "Focus Sanctuary and Anti-Distraction", subtitle = "Pomodoro, 3-Hr JEE Stamina and Reels Shield", icon = Icons.Outlined.Timer)
                  }

                  item {
                      SankalpCard {
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              FocusMode.entries.forEach { mode ->
                                  FilterChip(
                                      selected = timerState.mode == mode,
                                      onClick = { viewModel.configureTimer(mode, if (mode == FocusMode.POMODORO) 50 else 180, timerState.selectedSubject) },
                                      enabled = !timerState.isRunning,
                                      label = { Text(mode.label, fontSize = 12.sp) }
                                  )
                              }
                          }
                          if (timerState.mode != FocusMode.STOPWATCH && !timerState.isRunning) {
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  listOf(25, 50, 90, 180).forEach { mins ->
                                      FilterChip(selected = timerState.targetMinutes == mins, onClick = { viewModel.configureTimer(timerState.mode, mins, timerState.selectedSubject) }, label = { Text(mins.toString() + "m") })
                                  }
                              }
                          }
                          if (!timerState.isRunning) {
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Subject.entries.forEach { subj ->
                                      FilterChip(selected = timerState.selectedSubject == subj, onClick = { viewModel.configureTimer(timerState.mode, timerState.targetMinutes, subj) }, label = { Text(subj.displayName, fontSize = 12.sp) })
                                  }
                              }
                          }

                          Spacer(modifier = Modifier.height(16.dp))
                          val totalSecs = (timerState.targetMinutes * 60).coerceAtLeast(1)
                          val progress = if (timerState.mode == FocusMode.STOPWATCH) ((timerState.elapsedSeconds % 3600) / 3600f) else timerState.remainingSeconds.toFloat() / totalSecs.toFloat()

                          Column(modifier = Modifier.fillMaxWidth(), horizontalAlignment = Alignment.CenterHorizontally) {
                              AnimatedRingMeter(progress = progress, size = 210.dp, strokeWidth = 12.dp, activeColor = SankalpPalette.subjectColor(timerState.selectedSubject)) {
                                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                      val displaySecs = if (timerState.mode == FocusMode.STOPWATCH) timerState.elapsedSeconds else timerState.remainingSeconds
                                      Text(text = String.format(Locale.US, "%02d:%02d", displaySecs / 60, displaySecs % 60), style = MaterialTheme.typography.displayLarge)
                                      Text(text = timerState.selectedSubject.displayName, style = MaterialTheme.typography.labelSmall, color = SankalpPalette.subjectColor(timerState.selectedSubject))
                                  }
                              }
                          }

                          Spacer(modifier = Modifier.height(16.dp))
                          if (!timerState.isRunning) {
                              Button(
                                  onClick = { viewModel.startFocusSession() },
                                  modifier = Modifier.fillMaxWidth().height(52.dp),
                                  shape = RoundedCornerShape(999.dp),
                                  colors = ButtonDefaults.buttonColors(containerColor = SankalpPalette.KesariAmber)
                              ) {
                                  Icon(Icons.Outlined.PlayArrow, contentDescription = null)
                                  Spacer(modifier = Modifier.width(8.dp))
                                  Text("BEGIN FOCUS BLOCK", fontWeight = FontWeight.Bold)
                              }
                          } else {
                              Button(
                                  onClick = {
                                      if (timerState.mode == FocusMode.STOPWATCH) viewModel.stopOrForfeitFocusSession(true)
                                      else if (prefs.strictModeEnabled) showStrictExitModal = true
                                      else viewModel.stopOrForfeitFocusSession(false)
                                  },
                                  modifier = Modifier.fillMaxWidth().height(52.dp),
                                  shape = RoundedCornerShape(999.dp),
                                  colors = ButtonDefaults.buttonColors(containerColor = SankalpPalette.DangerCrimson)
                              ) {
                                  Icon(if (prefs.strictModeEnabled) Icons.Outlined.Lock else Icons.Outlined.Stop, contentDescription = null)
                                  Spacer(modifier = Modifier.width(8.dp))
                                  Text(if (prefs.strictModeEnabled) "STRICT MODE LOCKED (TAP FOR COOLDOWN)" else "STOP SESSION", fontWeight = FontWeight.Bold)
                              }
                          }
                      }
                  }

                  item {
                      SectionHeader(title = "Anti-Distraction Shield", subtitle = "Accessibility Guardian Settings", icon = Icons.Outlined.Security, accent = SankalpPalette.PrussianTeal)
                      SankalpCard {
                          if (!accessibilityActive) {
                              OutlinedButton(
                                  onClick = { context.startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) },
                                  modifier = Modifier.fillMaxWidth(),
                                  border = BorderStroke(1.dp, SankalpPalette.KesariAmber)
                              ) {
                                  Text("ENABLE ACCESSIBILITY SHIELD IN ANDROID SETTINGS", color = SankalpPalette.KesariAmber, fontWeight = FontWeight.Bold, fontSize = 12.sp)
                              }
                          }
                          Row(modifier = Modifier.fillMaxWidth().padding(vertical = 6.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Text("Strict Mode (Impulse Quitting Lock)", modifier = Modifier.weight(1f))
                              Switch(checked = prefs.strictModeEnabled, onCheckedChange = { viewModel.toggleStrictMode(it) })
                          }
                          Row(modifier = Modifier.fillMaxWidth().padding(vertical = 6.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Text("Reels and Shorts 1-Video Loop Breaker", modifier = Modifier.weight(1f))
                              Switch(checked = prefs.reelsLoopBreakerEnabled, onCheckedChange = { viewModel.toggleReelsShield(it) })
                          }
                          Row(modifier = Modifier.fillMaxWidth().padding(vertical = 6.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Text("Auto Study/Sleep Schedule Blocking", modifier = Modifier.weight(1f))
                              Switch(checked = prefs.scheduleEnabled, onCheckedChange = { viewModel.toggleScheduleEnabled(it) })
                          }
                      }
                  }

                  item {
                      SectionHeader(title = "Blocked Distracting Apps", icon = Icons.Outlined.Block, accent = SankalpPalette.MathsCoral)
                      SankalpCard {
                          FlowRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              DISTRACTING_APPS.forEach { (label, pkg) ->
                                  val isBlocked = prefs.blockedPackages.contains(pkg)
                                  FilterChip(selected = isBlocked, onClick = { viewModel.toggleBlockedPackage(pkg) }, label = { Text(if (isBlocked) ("Blocked: " + label) else label) })
                              }
                          }
                      }
                      Spacer(modifier = Modifier.height(20.dp))
                  }
              }

              if (showStrictExitModal) {
                  var cooldownSeconds by remember { mutableIntStateOf(12) }
                  var pledgeInput by remember { mutableStateOf("") }
                  LaunchedEffect(Unit) {
                      while (cooldownSeconds > 0) {
                          delay(1_000L)
                          cooldownSeconds--
                      }
                  }
                  AlertDialog(
                      onDismissRequest = { showStrictExitModal = false },
                      title = { Text("Strict Mode Cooldown") },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Text("Impulse urges pass in 12 seconds. Stay with your JEE goal.")
                              if (cooldownSeconds > 0) {
                                  Text("Cooldown remaining: " + cooldownSeconds.toString() + "s", fontFamily = FontFamily.Monospace, fontWeight = FontWeight.Bold, color = SankalpPalette.KesariAmber)
                              } else {
                                  OutlinedTextField(value = pledgeInput, onValueChange = { pledgeInput = it }, label = { Text("Type 'quit focus' to exit") }, singleLine = true)
                              }
                          }
                      },
                      confirmButton = { Button(onClick = { showStrictExitModal = false }) { Text("Stay Focused") } },
                      dismissButton = {
                          TextButton(
                              enabled = cooldownSeconds == 0 && pledgeInput.trim().lowercase() == "quit focus",
                              onClick = {
                                  viewModel.stopOrForfeitFocusSession(false)
                                  showStrictExitModal = false
                              }
                          ) { Text("Forfeit", color = SankalpPalette.DangerCrimson) }
                      }
                  )
              }
          }
