          cat << 'EOF' > app/src/main/java/com/sankalp/jee/data/preferences/UserPreferencesRepository.kt
          package com.sankalp.jee.data.preferences

          import android.content.Context
          import androidx.datastore.core.DataStore
          import androidx.datastore.preferences.core.Preferences
          import androidx.datastore.preferences.core.booleanPreferencesKey
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.intPreferencesKey
          import androidx.datastore.preferences.core.longPreferencesKey
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.core.stringSetPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map
          import java.time.LocalDate

          val Context.sankalpDataStore: DataStore<Preferences> by preferencesDataStore(name = "sankalp_user_prefs")

          data class UserPreferencesState(
              val darkTheme: Boolean = true,
              val examTargetName: String = "JEE Main Session 1",
              val examTargetEpochDay: Long = LocalDate.now().plusDays(92).toEpochDay(),
              val dailyTargetFocusMinutes: Int = 360,
              val currentStreakDays: Int = 4,
              val lastActiveStreakEpochDay: Long = LocalDate.now().toEpochDay(),
              val totalXp: Int = 1420,
              val isFocusSessionActive: Boolean = false,
              val strictModeEnabled: Boolean = true,
              val reelsLoopBreakerEnabled: Boolean = true,
              val adultAndSiteShieldEnabled: Boolean = true,
              val blockedPackages: Set<String> = DEFAULT_BLOCKED_PACKAGES,
              val blockedDomains: Set<String> = DEFAULT_BLOCKED_DOMAINS,
              val perAppDailyLimitMinutes: Int = 30,
              val scheduleEnabled: Boolean = true,
              val studyWindowStartHour: Int = 6,
              val studyWindowEndHour: Int = 12,
              val sleepWindowStartHour: Int = 23,
              val sleepWindowEndHour: Int = 5
          ) {
              companion object {
                  val DEFAULT_BLOCKED_PACKAGES = setOf(
                      "com.instagram.android",
                      "com.zhiliaoapp.musically",
                      "com.snapchat.android",
                      "com.twitter.android",
                      "com.reddit.frontpage",
                      "com.netflix.mediaclient",
                      "com.pubg.imobile",
                      "com.dts.freefireth"
                  )
                  val DEFAULT_BLOCKED_DOMAINS = setOf(
                      "instagram.com",
                      "reddit.com",
                      "x.com",
                      "twitter.com",
                      "facebook.com",
                      "9gag.com",
                      "twitch.tv"
                  )
              }
          }

          class UserPreferencesRepository(private val context: Context) {
              private object Keys {
                  val DARK_THEME = booleanPreferencesKey("dark_theme")
                  val EXAM_NAME = stringPreferencesKey("exam_name")
                  val EXAM_EPOCH_DAY = longPreferencesKey("exam_epoch_day")
                  val DAILY_TARGET_MINS = intPreferencesKey("daily_target_mins")
                  val STREAK_DAYS = intPreferencesKey("streak_days")
                  val LAST_STREAK_DAY = longPreferencesKey("last_streak_day")
                  val TOTAL_XP = intPreferencesKey("total_xp")
                  val FOCUS_ACTIVE = booleanPreferencesKey("focus_active")
                  val STRICT_MODE = booleanPreferencesKey("strict_mode")
                  val REELS_SHIELD = booleanPreferencesKey("reels_shield")
                  val SITE_SHIELD = booleanPreferencesKey("site_shield")
                  val BLOCKED_PACKAGES = stringSetPreferencesKey("blocked_packages")
                  val BLOCKED_DOMAINS = stringSetPreferencesKey("blocked_domains")
                  val APP_DAILY_LIMIT_MINS = intPreferencesKey("app_daily_limit_mins")
                  val SCHEDULE_ENABLED = booleanPreferencesKey("schedule_enabled")
              }

              val preferencesFlow: Flow<UserPreferencesState> = context.sankalpDataStore.data.map { prefs ->
                  UserPreferencesState(
                      darkTheme = prefs[Keys.DARK_THEME] ?: true,
                      examTargetName = prefs[Keys.EXAM_NAME] ?: "JEE Main Session 1",
                      examTargetEpochDay = prefs[Keys.EXAM_EPOCH_DAY] ?: LocalDate.now().plusDays(92).toEpochDay(),
                      dailyTargetFocusMinutes = prefs[Keys.DAILY_TARGET_MINS] ?: 360,
                      currentStreakDays = prefs[Keys.STREAK_DAYS] ?: 4,
                      lastActiveStreakEpochDay = prefs[Keys.LAST_STREAK_DAY] ?: LocalDate.now().toEpochDay(),
                      totalXp = prefs[Keys.TOTAL_XP] ?: 1420,
                      isFocusSessionActive = prefs[Keys.FOCUS_ACTIVE] ?: false,
                      strictModeEnabled = prefs[Keys.STRICT_MODE] ?: true,
                      reelsLoopBreakerEnabled = prefs[Keys.REELS_SHIELD] ?: true,
                      adultAndSiteShieldEnabled = prefs[Keys.SITE_SHIELD] ?: true,
                      blockedPackages = prefs[Keys.BLOCKED_PACKAGES] ?: UserPreferencesState.DEFAULT_BLOCKED_PACKAGES,
                      blockedDomains = prefs[Keys.BLOCKED_DOMAINS] ?: UserPreferencesState.DEFAULT_BLOCKED_DOMAINS,
                      perAppDailyLimitMinutes = prefs[Keys.APP_DAILY_LIMIT_MINS] ?: 30,
                      scheduleEnabled = prefs[Keys.SCHEDULE_ENABLED] ?: true
                  )
              }

              suspend fun setDarkTheme(enabled: Boolean) { context.sankalpDataStore.edit { it[Keys.DARK_THEME] = enabled } }
              suspend fun setFocusSessionActive(active: Boolean) { context.sankalpDataStore.edit { it[Keys.FOCUS_ACTIVE] = active } }
              suspend fun setStrictMode(enabled: Boolean) { context.sankalpDataStore.edit { it[Keys.STRICT_MODE] = enabled } }
              suspend fun setReelsShield(enabled: Boolean) { context.sankalpDataStore.edit { it[Keys.REELS_SHIELD] = enabled } }
              suspend fun setSiteShield(enabled: Boolean) { context.sankalpDataStore.edit { it[Keys.SITE_SHIELD] = enabled } }
              suspend fun setScheduleEnabled(enabled: Boolean) { context.sankalpDataStore.edit { it[Keys.SCHEDULE_ENABLED] = enabled } }

              suspend fun toggleBlockedPackage(packageName: String) {
                  context.sankalpDataStore.edit { prefs ->
                      val current = (prefs[Keys.BLOCKED_PACKAGES] ?: UserPreferencesState.DEFAULT_BLOCKED_PACKAGES).toMutableSet()
                      if (current.contains(packageName)) current.remove(packageName) else current.add(packageName)
                      prefs[Keys.BLOCKED_PACKAGES] = current
                  }
              }

              suspend fun updateExamCountdown(examName: String, daysFromToday: Long) {
                  val targetDay = LocalDate.now().plusDays(daysFromToday.coerceAtLeast(1)).toEpochDay()
                  context.sankalpDataStore.edit { prefs ->
                      prefs[Keys.EXAM_NAME] = examName
                      prefs[Keys.EXAM_EPOCH_DAY] = targetDay
                  }
              }

              suspend fun awardXpAndCheckStreak(xpDelta: Int) {
                  val today = LocalDate.now().toEpochDay()
                  context.sankalpDataStore.edit { prefs ->
                      val currentXp = prefs[Keys.TOTAL_XP] ?: 1420
                      prefs[Keys.TOTAL_XP] = currentXp + xpDelta
                      val lastDay = prefs[Keys.LAST_STREAK_DAY] ?: (today - 1)
                      val currentStreak = prefs[Keys.STREAK_DAYS] ?: 1
                      if (today == lastDay + 1L) {
                          prefs[Keys.STREAK_DAYS] = currentStreak + 1
                          prefs[Keys.LAST_STREAK_DAY] = today
                      } else if (today > lastDay + 1L) {
                          prefs[Keys.STREAK_DAYS] = 1
                          prefs[Keys.LAST_STREAK_DAY] = today
                      }
                  }
              }
          }
