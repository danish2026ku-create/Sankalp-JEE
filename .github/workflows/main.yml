          cat << 'EOF' > app/src/main/java/com/sankalp/jee/service/SankalpGuardianService.kt
          package com.sankalp.jee.service

          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Toast
          import com.sankalp.jee.data.preferences.UserPreferencesState
          import com.sankalp.jee.data.preferences.sankalpDataStore
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.flow.collectLatest
          import kotlinx.coroutines.launch
          import java.time.LocalTime
          import java.util.concurrent.atomic.AtomicInteger

          class SankalpGuardianService : AccessibilityService() {
              private val serviceScope = CoroutineScope(SupervisorJob() + Dispatchers.Main)
              private var latestPrefs = UserPreferencesState()
              private val shortVideoSwipeCounter = AtomicInteger(0)
              private var lastShortSwipeTimestamp = 0L
              private var lastToastTimestamp = 0L

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  serviceScope.launch {
                      applicationContext.sankalpDataStore.data.collectLatest { prefs ->
                          val focusActive = prefs[androidx.datastore.preferences.core.booleanPreferencesKey("focus_active")] ?: false
                          val reelsShield = prefs[androidx.datastore.preferences.core.booleanPreferencesKey("reels_shield")] ?: true
                          val siteShield = prefs[androidx.datastore.preferences.core.booleanPreferencesKey("site_shield")] ?: true
                          val scheduleEnabled = prefs[androidx.datastore.preferences.core.booleanPreferencesKey("schedule_enabled")] ?: true
                          val blockedApps = prefs[androidx.datastore.preferences.core.stringSetPreferencesKey("blocked_packages")]
                              ?: UserPreferencesState.DEFAULT_BLOCKED_PACKAGES
                          val blockedDomains = prefs[androidx.datastore.preferences.core.stringSetPreferencesKey("blocked_domains")]
                              ?: UserPreferencesState.DEFAULT_BLOCKED_DOMAINS

                          latestPrefs = latestPrefs.copy(
                              isFocusSessionActive = focusActive,
                              reelsLoopBreakerEnabled = reelsShield,
                              adultAndSiteShieldEnabled = siteShield,
                              scheduleEnabled = scheduleEnabled,
                              blockedPackages = blockedApps,
                              blockedDomains = blockedDomains
                          )
                      }
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  val currentEvent = event ?: return
                  val pkg = currentEvent.packageName?.toString() ?: return
                  if (pkg == packageName || pkg.contains("systemui") || pkg.contains("launcher")) {
                      shortVideoSwipeCounter.set(0)
                      return
                  }

                  val shouldEnforceAppBlock = latestPrefs.isFocusSessionActive || isInsideScheduledBlockWindow()
                  if (shouldEnforceAppBlock && latestPrefs.blockedPackages.contains(pkg)) {
                      performGlobalAction(GLOBAL_ACTION_HOME)
                      showCalmNudge("Sankalp Shield: Focus active. Returning to study sanctuary.")
                      return
                  }

                  if (latestPrefs.reelsLoopBreakerEnabled && (pkg == "com.instagram.android" || pkg == "com.google.android.youtube")) {
                      val rootNode = rootInActiveWindow
                      if (rootNode != null && isInsideReelsOrShortsViewer(rootNode, pkg)) {
                          if (currentEvent.eventType == AccessibilityEvent.TYPE_VIEW_SCROLLED) {
                              val now = System.currentTimeMillis()
                              if (now - lastShortSwipeTimestamp > 900L) {
                                  lastShortSwipeTimestamp = now
                                  if (shortVideoSwipeCounter.incrementAndGet() >= 2) {
                                      shortVideoSwipeCounter.set(0)
                                      performGlobalAction(GLOBAL_ACTION_HOME)
                                      showCalmNudge("1 Short/Reel limit reached. Back to your JEE rank.")
                                      return
                                  }
                              }
                          }
                      }
                  }

                  if (latestPrefs.adultAndSiteShieldEnabled && BROWSER_URL_BAR_IDS.containsKey(pkg)) {
                      val rootNode = rootInActiveWindow ?: return
                      val urlBarId = BROWSER_URL_BAR_IDS[pkg] ?: return
                      val nodes = rootNode.findAccessibilityNodeInfosByViewId(urlBarId)
                      val currentUrl = nodes?.firstOrNull()?.text?.toString()?.lowercase() ?: ""
                      if (currentUrl.isNotBlank() && latestPrefs.blockedDomains.any { currentUrl.contains(it) }) {
                          performGlobalAction(GLOBAL_ACTION_BACK)
                          performGlobalAction(GLOBAL_ACTION_HOME)
                          showCalmNudge("Sankalp Web Shield: Distracting site blocked.")
                      }
                  }
              }

              private fun isInsideScheduledBlockWindow(): Boolean {
                  if (!latestPrefs.scheduleEnabled) return false
                  val hour = LocalTime.now().hour
                  val inStudySlot = hour in latestPrefs.studyWindowStartHour until latestPrefs.studyWindowEndHour
                  val inSleepSlot = hour >= latestPrefs.sleepWindowStartHour || hour < latestPrefs.sleepWindowEndHour
                  return inStudySlot || inSleepSlot
              }

              private fun isInsideReelsOrShortsViewer(root: AccessibilityNodeInfo, pkg: String): Boolean {
                  if (pkg == "com.google.android.youtube") {
                      if (!root.findAccessibilityNodeInfosByViewId("com.google.android.youtube:id/reel_recycler").isNullOrEmpty()) return true
                      if (!root.findAccessibilityNodeInfosByViewId("com.google.android.youtube:id/reel_player_page_container").isNullOrEmpty()) return true
                  }
                  if (pkg == "com.instagram.android") {
                      if (!root.findAccessibilityNodeInfosByViewId("com.instagram.android:id/clips_viewer_view_pager").isNullOrEmpty()) return true
                      if (!root.findAccessibilityNodeInfosByViewId("com.instagram.android:id/reel_viewer_root").isNullOrEmpty()) return true
                  }
                  return false
              }

              private fun showCalmNudge(message: String) {
                  val now = System.currentTimeMillis()
                  if (now - lastToastTimestamp > 3200L) {
                      lastToastTimestamp = now
                      Toast.makeText(applicationContext, message, Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onInterrupt() {}
              override fun onDestroy() {
                  super.onDestroy()
                  serviceScope.cancel()
              }

              companion object {
                  private val BROWSER_URL_BAR_IDS = mapOf(
                      "com.android.chrome" to "com.android.chrome:id/url_bar",
                      "com.brave.browser" to "com.brave.browser:id/url_bar",
                      "org.mozilla.firefox" to "org.mozilla.firefox:id/mozac_browser_toolbar_url_view",
                      "com.microsoft.emmx" to "com.microsoft.emmx:id/url_bar"
                  )
              }
          }
