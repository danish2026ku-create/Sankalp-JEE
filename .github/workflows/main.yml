          package com.sankalp.jee.ui.viewmodel

          import android.app.Application
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import com.sankalp.jee.data.local.ErrorCategory
          import com.sankalp.jee.data.local.ErrorLogEntity
          import com.sankalp.jee.data.local.FlashcardEntity
          import com.sankalp.jee.data.local.FocusMode
          import com.sankalp.jee.data.local.FocusSessionEntity
          import com.sankalp.jee.data.local.MockTestEntity
          import com.sankalp.jee.data.local.QuickNoteEntity
          import com.sankalp.jee.data.local.SankalpDatabase
          import com.sankalp.jee.data.local.SeedData
          import com.sankalp.jee.data.local.StudyTaskEntity
          import com.sankalp.jee.data.local.Subject
          import com.sankalp.jee.data.local.SyllabusChapterEntity
          import com.sankalp.jee.data.local.TopicStatus
          import com.sankalp.jee.data.preferences.UserPreferencesRepository
          import com.sankalp.jee.data.preferences.UserPreferencesState
          import com.sankalp.jee.widget.SankalpWidgetReceiver
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.SharingStarted
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.flow.combine
          import kotlinx.coroutines.flow.stateIn
          import kotlinx.coroutines.launch
          import java.time.LocalDate
          import kotlin.math.roundToInt

          data class WeaknessRadarItem(
              val chapter: SyllabusChapterEntity,
              val errorCount: Int,
              val priorityScore: Float,
              val reason: String
          )

          data class TimerUiState(
              val mode: FocusMode = FocusMode.POMODORO,
              val selectedSubject: Subject = Subject.PHYSICS,
              val targetMinutes: Int = 50,
              val remainingSeconds: Int = 50 * 60,
              val elapsedSeconds: Int = 0,
              val isRunning: Boolean = false,
              val celebrationBurstKey: Int = 0
          )

          data class SankalpDashboardMetrics(
              val daysToExam: Long = 92,
              val todayFocusMinutes: Int = 0,
              val weekFocusMinutes: Int = 0,
              val focusScoreToday: Int = 0,
              val levelTitle: String = "Abhyasi Lv 3",
              val xpProgressInLevel: Float = 0.42f,
              val syllabusCompletionPercent: Int = 0,
              val backlogCount: Int = 0,
              val dueFlashcardsCount: Int = 0,
              val weaknessRadarTop5: List<WeaknessRadarItem> = emptyList()
          )

          class SankalpViewModel(application: Application) : AndroidViewModel(application) {
              private val appContext = application.applicationContext
              private val dao = SankalpDatabase.getInstance(appContext).sankalpDao()
              private val prefsRepo = UserPreferencesRepository(appContext)

              val userPrefs: StateFlow<UserPreferencesState> = prefsRepo.preferencesFlow.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), UserPreferencesState())
              val chapters: StateFlow<List<SyllabusChapterEntity>> = dao.observeAllChapters().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), emptyList())
              val tasks: StateFlow<List<StudyTaskEntity>> = dao.observeAllTasks().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), emptyList())
              val focusSessions: StateFlow<List<FocusSessionEntity>> = dao.observeFocusSessions().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), emptyList())
              val mockTests: StateFlow<List<MockTestEntity>> = dao.observeMockTests().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), emptyList())
              val errorLogs: StateFlow<List<ErrorLogEntity>> = dao.observeErrorLogs().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), emptyList())
              val flashcards: StateFlow<List<FlashcardEntity>> = dao.observeFlashcards().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), emptyList())
              val quickNotes: StateFlow<List<QuickNoteEntity>> = dao.observeQuickNotes().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), emptyList())

              private val _timerState = MutableStateFlow(TimerUiState())
              val timerState: StateFlow<TimerUiState> = _timerState.asStateFlow()

              private var timerJob: Job? = null

              val dashboardMetrics: StateFlow<SankalpDashboardMetrics> = combine(
                  userPrefs, chapters, tasks, focusSessions,
                  combine(errorLogs, flashcards) { errs, cards -> errs to cards }
              ) { prefs, chaps, taskList, sessions, (errors, cards) ->
                  val today = LocalDate.now().toEpochDay()
                  val daysLeft = (prefs.examTargetEpochDay - today).coerceAtLeast(0L)
                  val todayFocusMins = sessions.filter { it.epochDay == today }.sumOf { it.durationMinutes }
                  val weekFocusMins = sessions.filter { it.epochDay >= today - 6 }.sumOf { it.durationMinutes }
                  val targetRatio = (todayFocusMins.toFloat() / prefs.dailyTargetFocusMinutes.coerceAtLeast(60)).coerceIn(0f, 1f)
                  val taskBonus = (taskList.count { it.isCompleted } * 6).coerceAtMost(20)
                  val focusScore = ((targetRatio * 80f).roundToInt() + taskBonus).coerceIn(0, 100)
                  val masteredOrRevised = chaps.count { it.status == TopicStatus.MASTERED || it.status == TopicStatus.REVISED }
                  val syllabusPct = if (chaps.isEmpty()) 0 else ((masteredOrRevised * 100f) / chaps.size).roundToInt()
                  val backlogs = chaps.count { it.isBacklog } + taskList.count { it.isBacklog && !it.isCompleted }
                  val dueCards = cards.count { it.nextReviewEpochDay <= today }

                  val errorCountByChapter = errors.groupingBy { it.chapterName }.eachCount()
                  val radar = chaps.map { chap ->
                      val errCount = errorCountByChapter[chap.chapterName] ?: 0
                      val masteryPenalty = when (chap.status) {
                          TopicStatus.NOT_STARTED -> 6f
                          TopicStatus.LEARNING -> 4f
                          TopicStatus.REVISED -> 1.5f
                          TopicStatus.MASTERED -> 0f
                      }
                      val score = ((6 - chap.confidence) * chap.weightage.multiplier * 3f) + (errCount * 4.5f) + masteryPenalty + (if (chap.isBacklog) 5f else 0f)
                      val reason = "Mock errors: " + errCount.toString() + " | Confidence " + chap.confidence.toString() + "/5 | " + chap.weightage.label
                      WeaknessRadarItem(chap, errCount, score, reason)
                  }.sortedByDescending { it.priorityScore }.take(5)

                  val levelNumber = (prefs.totalXp / 500) + 1
                  val levelLabel = "Abhyasi Lv " + levelNumber.toString()
                  val xpInLevel = (prefs.totalXp % 500) / 500f

                  SankalpWidgetReceiver.pushLiveUpdate(
                      context = appContext,
                      daysLeftText = daysLeft.toString() + " DAYS LEFT",
                      focusStatsText = "Today: " + todayFocusMins.toString() + "m | Streak: " + prefs.currentStreakDays.toString() + "d",
                      nextTaskText = "Next: " + (taskList.firstOrNull { !it.isCompleted }?.title ?: "Revise SM-2 Flashcards")
                  )

                  SankalpDashboardMetrics(daysLeft, todayFocusMins, weekFocusMins, focusScore, levelLabel, xpInLevel, syllabusPct, backlogs, dueCards, radar)
              }.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), SankalpDashboardMetrics())

              init {
                  viewModelScope.launch {
                      if (dao.getChapterCount() == 0) {
                          dao.insertChapters(SeedData.initialSyllabus())
                          SeedData.initialTasks().forEach { dao.insertTask(it) }
                          dao.insertFlashcards(SeedData.initialFlashcards())
                          SeedData.initialMockTests().forEach { dao.insertMockTest(it) }
                          SeedData.initialErrorLogs().forEach { dao.insertErrorLog(it) }
                          SeedData.initialQuickNotes().forEach { dao.insertQuickNote(it) }
                      }
                  }
              }

              fun configureTimer(mode: FocusMode, minutes: Int, subject: Subject) {
                  if (_timerState.value.isRunning) return
                  _timerState.value = _timerState.value.copy(
                      mode = mode,
                      selectedSubject = subject,
                      targetMinutes = minutes,
                      remainingSeconds = if (mode == FocusMode.STOPWATCH) 0 else minutes * 60,
                      elapsedSeconds = 0
                  )
              }

              fun startFocusSession() {
                  if (_timerState.value.isRunning) return
                  _timerState.value = _timerState.value.copy(isRunning = true)
                  viewModelScope.launch { prefsRepo.setFocusSessionActive(true) }
                  timerJob?.cancel()
                  timerJob = viewModelScope.launch {
                      while (_timerState.value.isRunning) {
                          delay(1_000L)
                          val current = _timerState.value
                          if (current.mode == FocusMode.STOPWATCH) {
                              _timerState.value = current.copy(elapsedSeconds = current.elapsedSeconds + 1, remainingSeconds = current.elapsedSeconds + 1)
                          } else {
                              val nextRem = current.remainingSeconds - 1
                              if (nextRem <= 0) {
                                  completeFocusSession(true)
                                  break
                              } else {
                                  _timerState.value = current.copy(remainingSeconds = nextRem, elapsedSeconds = current.elapsedSeconds + 1)
                              }
                          }
                      }
                  }
              }

              fun stopOrForfeitFocusSession(cleanStopForStopwatch: Boolean = false) {
                  val current = _timerState.value
                  timerJob?.cancel()
                  val minutesCompleted = (current.elapsedSeconds / 60).coerceAtLeast(if (cleanStopForStopwatch) 1 else 0)
                  _timerState.value = current.copy(
                      isRunning = false,
                      remainingSeconds = if (current.mode == FocusMode.STOPWATCH) 0 else current.targetMinutes * 60,
                      elapsedSeconds = 0,
                      celebrationBurstKey = if (cleanStopForStopwatch) current.celebrationBurstKey + 1 else current.celebrationBurstKey
                  )
                  viewModelScope.launch {
                      prefsRepo.setFocusSessionActive(false)
                      if (minutesCompleted >= 1) {
                          dao.insertFocusSession(FocusSessionEntity(mode = current.mode, subject = current.selectedSubject, durationMinutes = minutesCompleted, epochDay = LocalDate.now().toEpochDay(), timestampMillis = System.currentTimeMillis(), completedCleanly = cleanStopForStopwatch))
                          if (cleanStopForStopwatch) prefsRepo.awardXpAndCheckStreak(minutesCompleted * 2)
                      }
                  }
              }

              private fun completeFocusSession(cleanCompletion: Boolean) {
                  val current = _timerState.value
                  timerJob?.cancel()
                  val mins = current.targetMinutes.coerceAtLeast(1)
                  _timerState.value = current.copy(isRunning = false, remainingSeconds = current.targetMinutes * 60, elapsedSeconds = 0, celebrationBurstKey = current.celebrationBurstKey + 1)
                  viewModelScope.launch {
                      prefsRepo.setFocusSessionActive(false)
                      dao.insertFocusSession(FocusSessionEntity(mode = current.mode, subject = current.selectedSubject, durationMinutes = mins, epochDay = LocalDate.now().toEpochDay(), timestampMillis = System.currentTimeMillis(), completedCleanly = cleanCompletion))
                      prefsRepo.awardXpAndCheckStreak(mins * 3)
                  }
              }

              fun toggleDarkTheme(enabled: Boolean) = viewModelScope.launch { prefsRepo.setDarkTheme(enabled) }
              fun toggleStrictMode(enabled: Boolean) = viewModelScope.launch { prefsRepo.setStrictMode(enabled) }
              fun toggleReelsShield(enabled: Boolean) = viewModelScope.launch { prefsRepo.setReelsShield(enabled) }
              fun toggleScheduleEnabled(enabled: Boolean) = viewModelScope.launch { prefsRepo.setScheduleEnabled(enabled) }
              fun toggleBlockedPackage(pkg: String) = viewModelScope.launch { prefsRepo.toggleBlockedPackage(pkg) }
              fun updateExamCountdown(name: String, daysLeft: Long) = viewModelScope.launch { prefsRepo.updateExamCountdown(name, daysLeft) }

              fun updateChapterMastery(chapter: SyllabusChapterEntity, status: TopicStatus, confidence: Int, solvedPyqs: Int, isBacklog: Boolean, completedTopicsCsv: String = chapter.completedTopicsCsv) {
                  viewModelScope.launch {
                      dao.updateChapter(chapter.copy(status = status, confidence = confidence.coerceIn(1, 5), solvedPyqs = solvedPyqs.coerceIn(0, chapter.totalPyqs), isBacklog = isBacklog, completedTopicsCsv = completedTopicsCsv, lastStudiedEpochDay = LocalDate.now().toEpochDay()))
                      prefsRepo.awardXpAndCheckStreak(15)
                  }
              }

              fun addStudyTask(title: String, subject: Subject, minutes: Int, isBacklog: Boolean) {
                  if (title.isBlank()) return
                  viewModelScope.launch {
                      val maxOrder = tasks.value.maxOfOrNull { it.sortOrder } ?: 0
                      dao.insertTask(StudyTaskEntity(title = title.trim(), subject = subject, estimatedMinutes = minutes.coerceIn(15, 360), targetEpochDay = LocalDate.now().toEpochDay(), isBacklog = isBacklog, sortOrder = maxOrder + 1))
                  }
              }

              fun toggleTaskCompleted(task: StudyTaskEntity) {
                  viewModelScope.launch {
                      val nextState = !task.isCompleted
                      dao.updateTask(task.copy(isCompleted = nextState))
                      if (nextState) prefsRepo.awardXpAndCheckStreak(25)
                  }
              }

              fun deleteTask(task: StudyTaskEntity) = viewModelScope.launch { dao.deleteTask(task) }

              fun logMockTest(testName: String, examPattern: String, maxMarks: Int, physics: Int, chemistry: Int, maths: Int, accuracyPercent: Int, durationMins: Int) {
                  viewModelScope.launch {
                      val total = (physics + chemistry + maths).coerceAtMost(maxMarks)
                      dao.insertMockTest(MockTestEntity(testName = testName.ifBlank { "Full Syllabus Mock" }, examPattern = examPattern, epochDay = LocalDate.now().toEpochDay(), maxMarks = maxMarks, totalScore = total, physicsScore = physics, chemistryScore = chemistry, mathsScore = maths, accuracyPercent = accuracyPercent.coerceIn(0, 100), durationMinutesTaken = durationMins, avgSecondsPerQuestion = ((durationMins * 60f) / 75f).roundToInt()))
                      prefsRepo.awardXpAndCheckStreak(80)
                  }
              }

              fun logQuestionError(subject: Subject, chapterName: String, category: ErrorCategory, questionSummary: String, oneLineFix: String, alsoCreateFlashcard: Boolean) {
                  if (questionSummary.isBlank() || oneLineFix.isBlank()) return
                  viewModelScope.launch {
                      val today = LocalDate.now().toEpochDay()
                      dao.insertErrorLog(ErrorLogEntity(subject = subject, chapterName = chapterName, errorCategory = category, questionSummary = questionSummary.trim(), oneLineFix = oneLineFix.trim(), epochDay = today))
                      if (alsoCreateFlashcard) {
                          dao.insertFlashcard(FlashcardEntity(subject = subject, chapterName = chapterName, frontPrompt = "Mistake Fix [" + chapterName + "]: " + questionSummary.trim(), backAnswer = oneLineFix.trim(), isFormula = false, nextReviewEpochDay = today))
                      }
                      prefsRepo.awardXpAndCheckStreak(20)
                  }
              }

              fun reviewFlashcardSm2(card: FlashcardEntity, quality: Int) {
                  viewModelScope.launch {
                      val today = LocalDate.now().toEpochDay()
                      val q = quality.coerceIn(0, 5)
                      val newReps = if (q < 3) 0 else card.repetitions + 1
                      val newInterval = if (q < 3) 1 else when (newReps) {
                          1 -> 1
                          2 -> 4
                          else -> (card.intervalDays * card.easinessFactor).roundToInt().coerceAtLeast(1)
                      }
                      val efDelta = 0.1f - (5 - q) * (0.08f + (5 - q) * 0.02f)
                      val newEf = (card.easinessFactor + efDelta).coerceAtLeast(1.3f)
                      dao.updateFlashcard(card.copy(repetitions = newReps, intervalDays = newInterval, easinessFactor = newEf, nextReviewEpochDay = today + newInterval))
                      prefsRepo.awardXpAndCheckStreak(10)
                  }
              }
          }
