                          Box(modifier = Modifier.size(32.dp).background(accent.copy(alpha = 0.14f), RoundedCornerShape(8.dp)), contentAlignment = Alignment.Center) {
                              Icon(imageVector = icon, contentDescription = title, tint = accent, modifier = Modifier.size(18.dp))
                          }
                          Spacer(modifier = Modifier.width(10.dp))
                      }
                      Column {
                          Text(text = title, style = MaterialTheme.typography.titleMedium, color = MaterialTheme.colorScheme.onBackground)
                          if (subtitle != null) {
                              Text(text = subtitle, style = MaterialTheme.typography.bodyMedium, color = MaterialTheme.colorScheme.onSurfaceVariant, fontSize = 12.sp)
                          }
                      }
                  }
              }
          }

          private data class ConfettiParticle(val angleRad: Float, val speed: Float, val color: Color, val radius: Float)

          @Composable
          fun CelebrationConfettiOverlay(triggerKey: Int, modifier: Modifier = Modifier) {
              if (triggerKey <= 0) return
              val progress = remember(triggerKey) { Animatable(0f) }
              val particles = remember(triggerKey) {
                  val colors = listOf(SankalpPalette.KesariAmber, SankalpPalette.PrussianTeal, SankalpPalette.PhysicsCyan, SankalpPalette.ChemistryEmerald, SankalpPalette.MathsCoral)
                  List(40) {
                      ConfettiParticle(
                          angleRad = (Random.nextFloat() * Math.PI * 2).toFloat(),
                          speed = Random.nextFloat() * 340f + 90f,
                          color = colors[it % colors.size],
                          radius = Random.nextFloat() * 6f + 4f
                      )
                  }
              }
              LaunchedEffect(triggerKey) {
                  progress.snapTo(0f)
                  progress.animateTo(1f, tween(1250, easing = FastOutSlowInEasing))
              }
              if (progress.value < 0.99f) {
                  Canvas(modifier = modifier.fillMaxSize()) {
                      val center = Offset(size.width / 2f, size.height / 3f)
                      val t = progress.value
                      val alpha = (1f - t).coerceIn(0f, 1f)
                      particles.forEach { p ->
                          val dx = cos(p.angleRad) * p.speed * t
                          val dy = sin(p.angleRad) * p.speed * t + (220f * t * t)
                          drawCircle(color = p.color.copy(alpha = alpha), radius = p.radius, center = Offset(center.x + dx, center.y + dy))
                      }
                  }
              }
          }
