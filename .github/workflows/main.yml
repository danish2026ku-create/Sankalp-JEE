          cat << 'EOF' > app/src/main/java/com/sankalp/jee/SankalpApp.kt
          package com.sankalp.jee

          import android.app.Application
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.os.Build
          import androidx.work.ExistingPeriodicWorkPolicy
          import androidx.work.PeriodicWorkRequestBuilder
          import androidx.work.WorkManager
          import com.sankalp.jee.service.DailyPulseWorker
          import java.util.concurrent.TimeUnit

          class SankalpApp : Application() {
              override fun onCreate() {
                  super.onCreate()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val manager = getSystemService(NotificationManager::class.java)
                      manager.createNotificationChannel(
                          NotificationChannel(CHANNEL_FOCUS_GUARD, "Focus Shield", NotificationManager.IMPORTANCE_HIGH)
                      )
                      manager.createNotificationChannel(
                          NotificationChannel(CHANNEL_DAILY_PULSE, "Daily Revision Pulse", NotificationManager.IMPORTANCE_DEFAULT)
                      )
                  }
                  val req = PeriodicWorkRequestBuilder<DailyPulseWorker>(6, TimeUnit.HOURS).build()
                  WorkManager.getInstance(this).enqueueUniquePeriodicWork(
                      "sankalp_daily_pulse",
                      ExistingPeriodicWorkPolicy.KEEP,
                      req
                  )
              }

              companion object {
                  const val CHANNEL_FOCUS_GUARD = "sankalp_focus_guard"
                  const val CHANNEL_DAILY_PULSE = "sankalp_daily_pulse"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/sankalp/jee/data/local/Entities.kt
          package com.sankalp.jee.data.local

          import androidx.room.Entity
          import androidx.room.PrimaryKey

          enum class Subject(val displayName: String, val shortCode: String) {
              PHYSICS("Physics", "PHY"),
              CHEMISTRY("Chemistry", "CHEM"),
              MATHEMATICS("Mathematics", "MATH")
          }

          enum class TopicStatus(val label: String) {
              NOT_STARTED("Not Started"),
              LEARNING("Learning"),
              REVISED("Revised"),
              MASTERED("Mastered")
          }

          enum class WeightageTier(val label: String, val multiplier: Float) {
              HIGH("High Yield", 1.6f),
              MEDIUM("Medium", 1.2f),
              LOW("Low", 0.8f)
          }

          enum class ErrorCategory(val label: String) {
              SILLY_CALCULATION("Silly / Calc"),
              CONCEPT_GAP("Concept Gap"),
              TIME_PRESSURE("Time Panic"),
              BLIND_GUESS("Impulse Guess")
          }

          enum class FocusMode(val label: String) {
              POMODORO("Pomodoro"),
              COUNTDOWN("3-Hr Exam Block"),
              STOPWATCH("Flow Stopwatch")
          }

          @Entity(tableName = "syllabus_chapters")
          data class SyllabusChapterEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val subject: Subject,
              val classLevel: Int,
              val chapterName: String,
              val topicsCsv: String,
              val completedTopicsCsv: String = "",
              val status: TopicStatus = TopicStatus.NOT_STARTED,
              val confidence: Int = 1,
              val weightage: WeightageTier = WeightageTier.MEDIUM,
              val totalPyqs: Int = 45,
              val solvedPyqs: Int = 0,
              val isBacklog: Boolean = false,
              val lastStudiedEpochDay: Long = 0L
          )

          @Entity(tableName = "study_tasks")
          data class StudyTaskEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val title: String,
              val subject: Subject,
              val estimatedMinutes: Int,
              val targetEpochDay: Long,
              val isCompleted: Boolean = false,
              val isBacklog: Boolean = false,
              val sortOrder: Int = 0
          )

          @Entity(tableName = "focus_sessions")
          data class FocusSessionEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val mode: FocusMode,
              val subject: Subject,
              val durationMinutes: Int,
              val epochDay: Long,
              val timestampMillis: Long,
              val completedCleanly: Boolean
          )

          @Entity(tableName = "mock_tests")
          data class MockTestEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val testName: String,
              val examPattern: String,
              val epochDay: Long,
              val maxMarks: Int,
              val totalScore: Int,
              val physicsScore: Int,
              val chemistryScore: Int,
              val mathsScore: Int,
              val accuracyPercent: Int,
              val durationMinutesTaken: Int,
              val avgSecondsPerQuestion: Int
          )

          @Entity(tableName = "error_logs")
          data class ErrorLogEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val subject: Subject,
              val chapterName: String,
              val errorCategory: ErrorCategory,
              val questionSummary: String,
              val oneLineFix: String,
              val epochDay: Long
          )

          @Entity(tableName = "flashcards")
          data class FlashcardEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val subject: Subject,
              val chapterName: String,
              val frontPrompt: String,
              val backAnswer: String,
              val isFormula: Boolean = true,
              val repetitions: Int = 0,
              val intervalDays: Int = 0,
              val easinessFactor: Float = 2.5f,
              val nextReviewEpochDay: Long = 0L
          )

          @Entity(tableName = "quick_notes")
          data class QuickNoteEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val subject: Subject,
              val title: String,
              val content: String,
              val tagsCsv: String,
              val isResolved: Boolean = false,
              val createdAtEpochDay: Long
          )
          EOF

          cat << 'EOF' > app/src/main/java/com/sankalp/jee/data/local/SankalpDao.kt
          package com.sankalp.jee.data.local

          import androidx.room.Dao
          import androidx.room.Delete
          import androidx.room.Insert
          import androidx.room.OnConflictStrategy
          import androidx.room.Query
          import androidx.room.Update
          import kotlinx.coroutines.flow.Flow

          @Dao
          interface SankalpDao {
              @Query("SELECT * FROM syllabus_chapters ORDER BY subject ASC, classLevel ASC, id ASC")
              fun observeAllChapters(): Flow<List<SyllabusChapterEntity>>

              @Query("SELECT COUNT(*) FROM syllabus_chapters")
              suspend fun getChapterCount(): Int

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun insertChapters(chapters: List<SyllabusChapterEntity>)

              @Update
              suspend fun updateChapter(chapter: SyllabusChapterEntity)

              @Query("SELECT * FROM study_tasks ORDER BY isCompleted ASC, sortOrder ASC, id DESC")
              fun observeAllTasks(): Flow<List<StudyTaskEntity>>

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun insertTask(task: StudyTaskEntity)

              @Update
              suspend fun updateTask(task: StudyTaskEntity)

              @Delete
              suspend fun deleteTask(task: StudyTaskEntity)

              @Query("SELECT * FROM focus_sessions ORDER BY timestampMillis DESC")
              fun observeFocusSessions(): Flow<List<FocusSessionEntity>>

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun insertFocusSession(session: FocusSessionEntity)

              @Query("SELECT * FROM mock_tests ORDER BY epochDay ASC, id ASC")
              fun observeMockTests(): Flow<List<MockTestEntity>>

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun insertMockTest(mockTest: MockTestEntity)

              @Query("SELECT * FROM error_logs ORDER BY id DESC")
              fun observeErrorLogs(): Flow<List<ErrorLogEntity>>

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun insertErrorLog(errorLog: ErrorLogEntity)

              @Query("SELECT * FROM flashcards ORDER BY nextReviewEpochDay ASC, id ASC")
              fun observeFlashcards(): Flow<List<FlashcardEntity>>

              @Query("SELECT COUNT(*) FROM flashcards WHERE nextReviewEpochDay <= :todayEpochDay")
              suspend fun getDueFlashcardCount(todayEpochDay: Long): Int

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun insertFlashcards(cards: List<FlashcardEntity>)

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun insertFlashcard(card: FlashcardEntity)

              @Update
              suspend fun updateFlashcard(card: FlashcardEntity)

              @Query("SELECT * FROM quick_notes ORDER BY isResolved ASC, id DESC")
              fun observeQuickNotes(): Flow<List<QuickNoteEntity>>

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun insertQuickNote(note: QuickNoteEntity)

              @Update
              suspend fun updateQuickNote(note: QuickNoteEntity)

              @Delete
              suspend fun deleteQuickNote(note: QuickNoteEntity)
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/sankalp/jee/data/local/SankalpDatabase.kt
          package com.sankalp.jee.data.local

          import android.content.Context
          import androidx.room.Database
          import androidx.room.Room
          import androidx.room.RoomDatabase
          import androidx.room.TypeConverter
          import androidx.room.TypeConverters

          class SankalpTypeConverters {
              @TypeConverter fun fromSubject(value: Subject): String = value.name
              @TypeConverter fun toSubject(value: String): Subject = Subject.valueOf(value)
              @TypeConverter fun fromTopicStatus(value: TopicStatus): String = value.name
              @TypeConverter fun toTopicStatus(value: String): TopicStatus = TopicStatus.valueOf(value)
              @TypeConverter fun fromWeightage(value: WeightageTier): String = value.name
              @TypeConverter fun toWeightage(value: String): WeightageTier = WeightageTier.valueOf(value)
              @TypeConverter fun fromErrorCategory(value: ErrorCategory): String = value.name
              @TypeConverter fun toErrorCategory(value: String): ErrorCategory = ErrorCategory.valueOf(value)
              @TypeConverter fun fromFocusMode(value: FocusMode): String = value.name
              @TypeConverter fun toFocusMode(value: String): FocusMode = FocusMode.valueOf(value)
          }

          @Database(
              entities = [
                  SyllabusChapterEntity::class,
                  StudyTaskEntity::class,
                  FocusSessionEntity::class,
                  MockTestEntity::class,
                  ErrorLogEntity::class,
                  FlashcardEntity::class,
                  QuickNoteEntity::class
              ],
              version = 1,
              exportSchema = false
          )
          @TypeConverters(SankalpTypeConverters::class)
          abstract class SankalpDatabase : RoomDatabase() {
              abstract fun sankalpDao(): SankalpDao

              companion object {
                  @Volatile
                  private var INSTANCE: SankalpDatabase? = null

                  fun getInstance(context: Context): SankalpDatabase {
                      return INSTANCE ?: synchronized(this) {
                          val instance = Room.databaseBuilder(
                              context.applicationContext,
                              SankalpDatabase::class.java,
                              "sankalp_jee_offline.db"
                          ).fallbackToDestructiveMigration().build()
                          INSTANCE = instance
                          instance
                      }
                  }
              }
          }
          EOF

